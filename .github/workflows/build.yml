name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore keystore
        id: ks
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секреты подписи не заданы. APK будет собран БЕЗ подписи и не установится на телефон."
          fi

      - name: Unit tests
        run: gradle testReleaseUnitTest --stacktrace

      - name: Assemble Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          f=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then
            cp "$f" out/Pixel-Sudoku-release.apk
          else
            cp "$f" out/Pixel-Sudoku-release-UNSIGNED.apk
            echo "::warning::Собрано БЕЗ подписи (Pixel-Sudoku-release-UNSIGNED.apk)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Pixel-Sudoku-APK
          path: out/*.apk
          if-no-files-found: error
